commit = "8f9835308de6159eb54f226041d5f81a780cb8eb"
licence = "Apache-2.0"
dialect = "ibm"
kind = "files"
programs = ["**/*.cbl", "**/*.cob"]
copybooks = ["**/COPYBOOK", "**/COPYLIB*", "**/copybook*"]

[[source]]
id = "cobol-is-fun"
repo = "https://github.com/IBM/cobol-is-fun"
commit = "d9244e6292db65fb5f87399246c0c70255f15255"
licence = "Apache-2.0"
dialect = "ibm"
kind = "files"
programs = ["**/*.cbl", "**/*.cob"]
copybooks = []

[[source]]
id = "cobol-programming-course"
repo = "https://github.com/openmainframeproject/cobol-programming-course"
commit = "780b1c9624e066b9d784a738896e493282c5fbf4"
licence = "CC-BY-4.0"
dialect = "ibm"
kind = "files"
programs = ["**/*.cbl", "**/*.cob", "**/*.CBL"]
copybooks = ["**/copybooks", "**/cbl"]

[[source]]
id = "cobol-check"
repo = "https://github.com/openmainframeproject/cobol-check"
commit = "c79624bd286d5f08f156ccce755bc5d4fffd1909"
licence = "Apache-2.0"
dialect = "ibm"
kind = "files"
programs = ["src/main/cobol/*.cbl", "src/main/cobol/*.CBL", "testfiles/*.cbl", "testfiles/*.CBL"]
copybooks = ["src/main/cobol/copy", "copybooks", "testfiles"]

[[source]]
id = "proleap-tests"
repo = "https://github.com/uwol/proleap-cobol-parser"
commit = "d1bfe75bdd6d480f70c74c6345bcc02610ac30d3"
licence = "MIT"
dialect = "ibm"
kind = "files"
# The gov/nist copy duplicates nist-cobol85; the tandem and preprocessor
# tests exercise non-IBM reference formats and COPY edge cases on purpose.
programs = ["src/test/resources/io/proleap/cobol/asg/**/*.cbl", "src/test/resources/io/proleap/cobol/ast/fixed/*.cbl", "src/test/resources/io/proleap/cobol/ast/variable/*.cbl"]
# Most asg/ tests are written in Tandem reference format (indicator in
# column 1, code from column 2), which this parser does not read; a file whose
# first line starts with one space then code is one of those.
skip_if_first_line = "^ \\S"
copybooks = ["src/test/resources/io/proleap/cobol/asg/**", "src/test/resources/io/proleap/cobol/ast/**"]

[[source]]
id = "beginning-cobol"
