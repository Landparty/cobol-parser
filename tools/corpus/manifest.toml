# Open-source COBOL corpus for the AST completeness harness.
#
# Nothing listed here is vendored into this repository: `fetch.py` clones each
# source at the pinned commit into a local cache (default `.corpus/`, which is
# git-ignored), and `run.py` reads it from there. Only sources whose licence
# allows redistribution and modification are listed; the licence is recorded
# per source so a report can say where each program came from. Repositories
# with no licence file are left out on purpose (no licence = all rights
# reserved), as are the GnuCOBOL `syn_*.at` tests (most are programs that are
# *meant* to fail compilation).
#
# Fields:
#   id         short name used in reports
#   repo       git URL (cloned shallow at `commit`), or `local` for an in-repo path
#   commit     full commit SHA the expectations were taken at
#   licence    SPDX identifier of the source's licence
#   dialect    "ibm" (IBM Enterprise / COBOL-85), "gnucobol", "microfocus" --
#              the parser targets IBM; other dialects are reported separately
#   kind       "files" (program files matched by `programs`) or
#              "gnucobol-at" (programs embedded in autotest .at files)
#   programs   globs (relative to the source root) of compilation units
#   copybooks  globs of directories searched for COPY members
#   exclude    globs of program files to skip
#   skip_if_first_line  regex; a program whose first line matches is skipped

[[source]]
id = "nist-cobol85"
local = "examples/cobol"
licence = "public-domain"
dialect = "ibm"
kind = "files"
programs = ["*.CBL"]
copybooks = ["."]

[[source]]
id = "carddemo"
repo = "https://github.com/aws-samples/aws-mainframe-modernization-carddemo"
commit = "59cc6c2fd7ebd7ef7925cad552a01a4b8b6e4d5e"
licence = "Apache-2.0"
dialect = "ibm"
kind = "files"
programs = ["app/**/*.cbl", "app/**/*.CBL"]
copybooks = ["app/cpy", "app/cpy-bms", "app/*/cpy", "app/*/cpy-bms"]

[[source]]
id = "cics-genapp"
repo = "https://github.com/cicsdev/cics-genapp"
commit = "f6f3f4b2580d31b7d8dcc31ce3e3676f4cceaaaa"
licence = "EPL-2.0"
dialect = "ibm"
kind = "files"
programs = ["base/src/*.cbl"]
copybooks = ["base/src"]

[[source]]
id = "dbb-zappbuild"
repo = "https://github.com/IBM/dbb-zappbuild"
commit = "796f48dd82ee9361661daf72966e0d3a13326237"
licence = "Apache-2.0"
dialect = "ibm"
kind = "files"
programs = ["samples/**/*.cbl"]
copybooks = ["samples/**/copybook", "samples/**/copy"]

[[source]]
id = "dbb"
repo = "https://github.com/IBM/dbb"
commit = "251b47505d19601feba13a5a99f8f537bbea4f25"
licence = "Apache-2.0"
dialect = "ibm"
kind = "files"
programs = ["**/*.cbl", "**/*.cob"]
