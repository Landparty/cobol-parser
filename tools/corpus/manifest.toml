programs = ["src/main/cobol/*.cbl", "src/test/cobol/**/*.cbl"]
copybooks = ["src/main/cobol/copy", "src/test/cobol/**"]

[[source]]
id = "gnucobol-testsuite"
repo = "https://github.com/OCamlPro/gnucobol"
commit = "52db7d130e66c5f1551bc3435735528ecf0c01ec"
licence = "GPL-3.0-or-later"
dialect = "gnucobol"
kind = "gnucobol-at"
programs = ["tests/testsuite.src/run_*.at", "tests/testsuite.src/data_*.at"]
copybooks = []
