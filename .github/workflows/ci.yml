name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual dispatch: lets CI be run on a branch when an event-triggered run
  # is unavailable (e.g. app-actor pushes/PRs that org policy doesn't run).
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned to match .pre-commit-config.yaml so local hooks and CI agree.
      - run: pip install "ruff==0.15.0" "black==26.3.0"
      - run: ruff check .
      - run: black --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned to match .pre-commit-config.yaml so local hooks and CI agree.
      - run: pip install "mypy==1.20.0"
      - run: mypy cobolparser/

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install setuptools
      - run: pip install -e ".[dev,fast]"
      - run: python setup.py build_ext --inplace

  # Full pytest suite (~8,100 tests), parallelized with pytest-xdist
  # (already a dev dependency, previously unused). ~80s locally with
  # -n auto; the suite was gated to workflow_dispatch-only before this
  # because the unparallelized run was too slow for every push/PR.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -n auto
