name: CI

# Manual dispatch only, to save cost: push, pull_request and the nightly
# schedule are switched off. Run lint, typecheck and the suite locally before
# pushing, or dispatch this workflow on a branch. (A fully commented-out file
# is an invalid workflow that GitHub reports as a failed run on every push.)
# To switch event-triggered CI back on, restore these triggers:
#   push / pull_request on main, paths-ignore docs/**, .okf/**, reports/**,
#   **/*.md; schedule cron "17 4 * * *" (nightly full matrix).
on:
  workflow_dispatch:

# A new push to a PR supersedes the run in flight. Never cancel runs on main:
# every merge should get its full-matrix result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned to match .pre-commit-config.yaml so local hooks and CI agree.
      - run: pip install "ruff==0.15.0" "black==26.3.0"
      - run: ruff check .
      - run: black --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned to match .pre-commit-config.yaml so local hooks and CI agree.
      - run: pip install "mypy==1.20.0"
      - run: mypy cobolparser/

  # Full suite, with the 90% coverage floor (pyproject.toml's addopts), on
  # every supported Python. The library is pure Python, so coverage sees every
  # line. `-p no:randomly` keeps a failure reproducible from the log; `-n auto`
  # keeps the job near two minutes.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Graphviz renders the DOT outputs in tests/integration/test_dot_graphviz.py
      # (skipped where `dot` is missing).
      - run: sudo apt-get install -y --no-install-recommends graphviz
      - run: python -m pytest tests/ -q -p no:randomly -n auto
