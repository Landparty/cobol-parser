name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # `releases_created` is the aggregate flag for manifest mode: true on the
      # run where the "chore: release X" PR is merged and the release is cut.
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # GITHUB_TOKEN works out of the box. Releases it creates do NOT
          # trigger other workflows -- that's why the publish job below lives
          # in THIS same workflow (gated on the output) instead of a separate
          # release-triggered workflow, which would never fire.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build the sdist plus a pure-Python fallback wheel (py3-none-any).
  # pip prefers the binary wheels from cibuildwheel when the platform matches;
  # this wheel is only used on platforms not covered by the binary matrix.
  build-sdist:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and pure-Python fallback wheel
        env:
          COBOLPARSER_SKIP_EXT: "1"
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/

  # Build binary wheels (with compiled C extensions) for Linux, macOS, Windows.
  # cibuildwheel compiles the three Cython modules (_lexer_fast, _preprocess_fast,
  # _data_fast) into .so/.pyd files and bundles them into platform-specific wheels.
  build-binary-wheels:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # QEMU lets the Linux runner cross-compile aarch64 wheels without a real ARM machine.
      - uses: docker/setup-qemu-action@v3
        if: runner.os == 'Linux'
        with:
          platforms: aarch64
      - uses: pypa/cibuildwheel@v2.21.3
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/

  # Build single-file executables with Nuitka. Unlike the wheels above,
  # which still ship plain .py source for everything the Cython hot paths
  # don't cover, Nuitka compiles the entire cobolparser package to machine
  # code -- these binaries embed no application source. See PUBLISHING.md.
  build-nuitka-executables:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cobol-parser-linux-x86_64
          - os: macos-latest
            artifact: cobol-parser-macos-arm64
          - os: windows-latest
            artifact: cobol-parser-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install patchelf (required by Nuitka onefile mode on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install cobolparser
        # Nuitka compiles the pure-Python source directly, so the Cython
        # extension build is unnecessary here (and would only slow down
        # the job).
        env:
          COBOLPARSER_SKIP_EXT: "1"
        run: pip install .
      - name: Install Nuitka
        run: pip install nuitka
      - name: Build onefile executable
        shell: bash
        run: scripts/build_executable.sh "${{ matrix.artifact }}"
      - name: Smoke-test the executable
        shell: bash
        run: |
          BIN="build/${{ matrix.artifact }}"
          chmod +x "$BIN" || true
          "$BIN" --version
          SAMPLE=$(find tests/samples -maxdepth 1 -iname "*.cbl" | head -1)
          "$BIN" parse "$SAMPLE" --stats
      - uses: actions/upload-artifact@v4
        with:
          name: dist-exe-${{ matrix.os }}
          path: build/${{ matrix.artifact }}

  # Collect every artifact and attach them all to the GitHub Release.
  publish:
    needs:
      [
        release-please,
        build-sdist,
        build-binary-wheels,
        build-nuitka-executables,
      ]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Resolve the release tag from the manifest
        id: tag
        # The merge commit that triggered this run already bumped the manifest
        # to the released version; tags use the v<version> format
        # (include-component-in-tag: false).
        run: echo "tag=v$(jq -r '.["."]' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Attach distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" dist/* --clobber
