[build-system]
requires = ["setuptools>=68.0", "wheel", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cobol-parser"
version = "1.8.3"
description = "A comprehensive COBOL parser for Python with IBM Enterprise COBOL focus"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Samuel Dion"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Linguistic",
]
keywords = ["cobol", "parser", "mainframe", "ibm", "enterprise", "legacy"]
dependencies = []

[project.optional-dependencies]
fast = ["cython>=3.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "cython>=3.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]
profiling = ["psutil>=5.9"]

[project.scripts]
cobol-parser = "cobolparser.cli:main"

[project.urls]
Homepage = "https://github.com/Landparty/cobol-parser"
Repository = "https://github.com/Landparty/cobol-parser"
"Bug Tracker" = "https://github.com/Landparty/cobol-parser/issues"

[tool.setuptools.packages.find]
include = ["cobolparser*"]

# `include_package_data` defaults to True for pyproject.toml-configured
# setuptools projects, and cythonize() writes each generated .c file next to
# its .py/.pyx source *inside* the package tree. Cython embeds the original
# source verbatim in C comments, so without this exclusion every closed-source
# wheel would ship a fully readable copy of every module it just compiled.
# Excluding by pattern (rather than setting include-package-data = false)
# keeps cobolparser/py.typed shipping without having to redeclare it.
#
# "*.py" belongs in this same list even though setup.py's _ClosedSourceBuildPy
# already restricts build_py's *module* copy (find_package_modules) to just
# __init__.py/__main__.py: include_package_data=True drives a SEPARATE build_py
# code path (build_package_data -> find_data_files -> manifest_files) that
# independently re-adds every .py file tracked in the sdist manifest as
# "package data", regardless of what find_package_modules already excluded.
# Without "*.py" here, that second path silently ships every stripped module's
# source right back into the wheel next to its compiled .pyd/.so twin.
# __init__.py/__main__.py are unaffected -- they still ship via the module
# path, which this setting does not touch.
[tool.setuptools.exclude-package-data]
"*" = ["*.c", "*.pyx", "*.h", "*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=cobolparser",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=90",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "contract: marks tests as contract tests",
    "io: marks tests as IO statement tests (OPEN, CLOSE, READ, WRITE, REWRITE, DELETE, START, ACCEPT, DISPLAY, UNLOCK)",
]

[tool.coverage.run]
source = ["cobolparser"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    "docs",  # one-off cookbook-patching scripts with intentionally broken Python
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py files

[tool.black]
target-version = ["py311"]
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
  # Exclude auto-generated files
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | docs  # one-off cookbook-patching scripts with intentionally broken Python
)/
'''

[tool.cibuildwheel]
# Build CPython 3.11–3.13 only (matches requires-python)
build = "cp311-* cp312-* cp313-*"
# Skip musllinux (Alpine) -- niche target for this library, and there's no
# sdist published for it to fall back to source-build from anyway.
skip = "*-musllinux*"
# Full closed-source build: every cobolparser module compiles, not just the
# 3 hot-path accelerators. See setup.py and
# docs/superpowers/specs/2026-08-14-pypi-closed-source-release-design.md.
environment = { COBOLPARSER_CLOSED_SOURCE = "1" }
test-requires = "pytest pytest-cov"
# Smoke-test against the INSTALLED wheel (not the source tree): verify
# ordinary modules loaded as compiled extensions (no .py source backing
# them), then run a fast subset of the suite. test_program_fixtures.py is
# in this subset deliberately, not just for speed (42 tests, ~0.5s): it's
# the fastest test file that actually calls into the generators package
# (ProgramFixtureGenerator -> BoundaryInventoryAnalyzer), which
# test_lexer.py/test_all_samples.py never touch. That gap is exactly how
# a closed-source-only TypeError in BoundaryInventoryAnalyzer._classify()
# (see CHANGELOG's Unreleased -> Fixed) shipped undetected -- Cython's
# closed-source build enforces module-level PEP 526 variable annotations
# as runtime C-level type checks, which plain pure-Python test runs can
# never exercise. --no-cov disables this repo's default
# --cov-fail-under=90 gate (see [tool.pytest.ini_options] addopts), which
# coverage.py can't evaluate meaningfully against compiled extensions.
#
# --import-mode=importlib is load-bearing, not cosmetic: tests/__init__.py
# exists, so under pytest's default "prepend" mode {project} lands at
# sys.path[0] and the SOURCE tree shadows the wheel installed in the test
# venv -- silently testing the wrong thing. importlib mode leaves sys.path
# alone, so `import cobolparser` resolves to the installed extensions.
#
# check_installed_no_leaked_source.py runs the same no-leaked-.py/.c/.pyx/.h/
# .pyi assertion as scripts/verify_closed_source_wheel.py, but against the
# installed package rather than the wheel zip -- cibuildwheel's test-command
# has no access to the wheel path itself. It runs on every one of this
# matrix's built wheels, not just a local/manual one.
test-command = "python {project}/scripts/check_installed_no_leaked_source.py && python -c \"import cobolparser.lexer, cobolparser.parser; assert not cobolparser.lexer.__file__.endswith('.py'); assert not cobolparser.parser.__file__.endswith('.py'); from cobolparser._lexer_fast import CobolLexer; from cobolparser._preprocess_fast import normalize_fixed_format; from cobolparser._data_fast import parse_data_item_clauses_fast; print('closed-source build OK')\" && pytest {project}/tests/unit/test_lexer.py {project}/tests/test_all_samples.py {project}/tests/unit/test_program_fixtures.py --no-cov -q --import-mode=importlib"

# NOTE: release CI overrides these per job via CIBW_ARCHS (see
# .github/workflows/release-please.yml). These values still apply to local
# `cibuildwheel` runs.
#
# Only the most common targets are covered: manylinux x86_64 (not aarch64 --
# that required slow QEMU emulation with no known ARM-Linux consumer) and
# macOS arm64 (not x86_64 -- Intel Macs are a shrinking minority for this
# library). Revisit if a real user needs one of the dropped targets.
[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false