[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cobol-parser"
version = "4.0.1"
description = "A comprehensive COBOL parser for Python with IBM Enterprise COBOL focus"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Samuel Dion", email = "sam94dion@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Linguistic",
]
keywords = ["cobol", "parser", "mainframe", "ibm", "enterprise", "legacy"]
dependencies = []

[project.optional-dependencies]
# `cobolparser.jcl` reads JCL through the sibling jcl-parser package; the
# rest of the library has no runtime dependency.
jcl = ["jcl-parser>=2.0.0"]
# The MCP server reads the PL/I and assembler programs under its root
# through the sibling parsers (cobolparser/mcp/languages.py), so a mixed
# codebase is one call graph. Neither is needed by the rest of the library.
pl1 = ["landparty-pl1-parser>=2.0.0"]
hlasm = ["hlasm-parser>=0.2.2"]
# `cobol-parser mcp`: the MCP server (cobolparser/mcp/server.py). Pinned below
# 2, whose SDK renames FastMCP; only server.py imports it.
mcp = ["mcp>=1.10,<2"]
dev = [
    "jcl-parser>=2.0.0",
    "mcp>=1.10,<2",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    # Pinned to the versions .pre-commit-config.yaml and CI use.
    "ruff==0.15.0",
    "black==26.10.1",
    "mypy==1.20.0",
]
profiling = ["psutil>=5.9"]

[project.scripts]
cobol-parser = "cobolparser.cli:main"

[project.urls]
Homepage = "https://github.com/Landparty/cobol-parser"
Repository = "https://github.com/Landparty/cobol-parser"
"Bug Tracker" = "https://github.com/Landparty/cobol-parser/issues"

[tool.setuptools.packages.find]
include = ["cobolparser*"]

# Stand-ins for IBM-supplied copybooks (DFHAID, DFHBMSCA), the last place a
# COPY is looked for; see cobolparser/preprocess/_system_copybooks.py.
[tool.setuptools.package-data]
"cobolparser.preprocess" = ["system_copybooks/*.cpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=cobolparser",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=90",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "contract: marks tests as contract tests",
    "io: marks tests as IO statement tests (OPEN, CLOSE, READ, WRITE, REWRITE, DELETE, START, ACCEPT, DISPLAY, UNLOCK)",
]

[tool.coverage.run]
source = ["cobolparser"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    "docs",  # one-off cookbook-patching scripts with intentionally broken Python
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py files

[tool.black]
target-version = ["py311"]
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
  # Exclude auto-generated files
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | docs  # one-off cookbook-patching scripts with intentionally broken Python
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# jcl-parser is an optional extra (`cobol-parser[jcl]`) and CI's typecheck
# job does not install it.
[[tool.mypy.overrides]]
module = ["jclparser", "jclparser.*"]
ignore_missing_imports = true

# The PL/I and assembler parsers are the optional [pl1] / [hlasm] extras,
# read only by cobolparser/mcp/languages.py. They are not in [dev] until
# they are published to PyPI: install them from their repositories.
[[tool.mypy.overrides]]
module = ["pl1_parser", "pl1_parser.*", "hlasmparser", "hlasmparser.*"]
ignore_missing_imports = true

# The MCP SDK is the optional [mcp] extra; only cobolparser/mcp/server.py
# imports it (with pydantic and anyio, which it brings in).
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "pydantic", "pydantic.*", "anyio", "anyio.*"]
ignore_missing_imports = true
